<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>Gigfloww Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
   body {
    font-family: 'Inter', sans-serif;
   }
  </style>
 </head>
 <body>
  <div class="min-h-screen flex flex-col md:flex-row">
   <div class="md:w-1/2 w-full">
    <img alt="Group of four diverse young professionals collaborating and discussing work around a laptop in a bright office"
     class="w-full h-full object-cover"
     src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" />
   </div>
   <div class="md:w-1/2 w-full flex flex-col justify-center items-center px-8 py-12 bg-gradient-to-br from-[#d6e2ea] via-[#b3c7d5] to-[#7f9db0]">
    <div class="flex flex-col items-center mb-6">
     <img alt="Gigfloww logo with blue geometric shapes" class="mb-2" height="40"
      src="https://storage.googleapis.com/a1aa/image/4e707c18-f4ee-4d0c-628e-7149d647540a.jpg" width="40" />
     <h1 class="text-white font-extrabold text-xl tracking-wide drop-shadow-md select-none">GIGFLOWW</h1>
    </div>
    <p class="text-black text-lg mb-8 select-none">Welcome to Gigfloww</p>
   <form action="/Register.html" method="POST">
 <h2 class="text-gray-900 text-2xl font-semibold mb-1 text-center">Register</h2>
     <p class="text-gray-600 text-center mb-6">
      Seamless HR operations start now!<br />
      Sign up
     </p>
     <label class="block text-gray-900 font-medium mb-1 select-none" for="name">Name</label>
     <input
      class="w-full mb-5 px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-400 text-gray-900"
      id="name" placeholder="Your name" type="text" required />

     <label class="block text-gray-900 font-medium mb-1 select-none" for="email">Email Address</label>
     <input
      class="w-full mb-5 px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-400 text-gray-900"
      id="email" placeholder="Your email" type="email" required />

     <label class="block text-gray-900 font-medium mb-1 select-none" for="password">Password</label>
     <input
      class="w-full mb-5 px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-400 text-gray-900"
      id="password" placeholder="Your password" type="password" required />

     <label class="block text-gray-900 font-medium mb-1 select-none" for="confirm-password">Confirm Password</label>
     <input
      class="w-full mb-7 px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-400 text-gray-900"
      id="confirm-password" placeholder="Re confirm your password" type="password" required />

     <button
      class="w-full bg-gradient-to-r from-blue-600 to-blue-900 text-white font-semibold rounded-md py-3 mb-5 hover:from-blue-700 hover:to-blue-950 transition-colors"
      type="submit">Register</button>
      <form id="registerForm" action="http://localhost:3000/register" method="POST">
  <input id="name" name="username" type="text" required />
  <input id="email" name="email" type="email" required />
  <input id="password" name="password" type="password" required />
  <input id="confirm-password" name="confirmPassword" type="password" required />


  

    </form>

    <p class="text-gray-600 mb-5 select-none">
     Already on Gigfloww?
     <a class="text-blue-600 hover:underline" href="signin.html">Log in</a>
    </p>

    <div class="flex gap-4 w-full max-w-md justify-center">
     <button
      class="flex items-center gap-2 border border-gray-700 rounded-full px-5 py-2 text-gray-900 bg-white hover:bg-gray-100 transition">
      <img alt="Google G logo" class="w-5 h-5"
       src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" />
      Register with Google
     </button>
     <button
      class="flex items-center gap-2 border border-gray-700 rounded-full px-5 py-2 text-gray-900 bg-white hover:bg-gray-100 transition">
      <i class="fab fa-apple text-lg"></i>
      Register with Apple
     </button>
    </div>
   </div>
  </div>

  <!-- ✅ JavaScript to handle redirection -->
  <script>
   document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault(); // prevent form from reloading the page

    // You can add real validation logic here if needed

    // Simulate successful registration and redirect
    alert("Registration successful!");
    window.location.href = "signin.html"; // redirect to login page
   });
  </script>
 </body>
</html>
