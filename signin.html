<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Gigfloww Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen flex">
    <div class="hidden md:block md:w-1/2">
      <img
        alt="Blurred image of multiple people joining hands in an office setting with documents and laptop on table"
        class="w-full h-full object-cover"
        src="https://storage.googleapis.com/a1aa/image/9fb15873-1bec-4bbc-dba4-cb9b4261f425.jpg"
      />
    </div>

    <div
      class="flex flex-col justify-center items-center w-full md:w-1/2 bg-gray-50 relative px-6 sm:px-12 py-16"
    >
      <img
        alt="Gigfloww logo with blue geometric icon and text"
        class="mb-8"
        height="40"
        src="https://storage.googleapis.com/a1aa/image/8acd5fd8-d05f-4a28-fa36-70f23835109e.jpg"
        width="120"
      />

      <h1 class="text-2xl font-semibold text-black mb-1">Welcome to Gigfloww</h1>
      <p class="text-gray-600 text-center mb-8 max-w-xs">
        Seamless HR operations start now!<br />
        Sign in
      </p>

      <form id="loginForm" class="w-full max-w-md space-y-6">
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-1" for="email">Work Email</label>
          <input
            class="w-full rounded-md border border-gray-300 px-4 py-3 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
            id="email"
            name="email"
            placeholder="Your Work Email Address"
            type="email"
            required
          />
        </div>

        <div class="relative">
          <label class="block text-sm font-semibold text-gray-900 mb-1" for="password">Password</label>
          <input
            class="w-full rounded-md border border-gray-300 px-4 py-3 pr-10 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
            id="password"
            name="password"
            placeholder="Your Password"
            type="password"
            required
          />
          <span class="absolute inset-y-0 right-3 flex items-center text-gray-400 cursor-pointer">
            <i class="fas fa-eye-slash"></i>
          </span>
        </div>

        <button
          class="w-full bg-gradient-to-r from-blue-600 to-blue-900 text-white font-semibold rounded-md py-3 text-lg hover:from-blue-700 hover:to-blue-800 transition-colors"
          type="submit"
        >
          Sign in
        </button>
      </form>

      <p class="text-xs text-gray-600 mt-4 max-w-xs text-center">
        By clicking on Sign in, you agree to our
        <a class="text-blue-800 font-semibold underline" href="#">Terms and Conditions</a>
      </p>

      <p class="text-sm text-gray-700 mt-12">
        Don’t have an account?
        <a class="text-blue-800 font-semibold" href="register.html">Register</a>
      </p>

      <svg
        aria-hidden="true"
        class="hidden md:block absolute top-0 right-0 w-72 h-72 stroke-blue-600 stroke-[1.5]"
        fill="none"
        style="transform: translate(50%, -50%)"
        viewBox="0 0 288 288"
      >
        <circle cx="144" cy="144" r="144"></circle>
        <circle cx="144" cy="144" r="96"></circle>
        <circle cx="144" cy="144" r="48"></circle>
      </svg>
    </div>

    <!-- ✅ JavaScript for login redirection -->
    <script>
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault(); // prevent default form submission

        // Dummy login success logic (you can add real authentication here)
        alert("Login successful!");
        window.location.href = "dashboard.html"; // ✅ redirect to dashboard
      });
    </script>
  </body>
</html>
