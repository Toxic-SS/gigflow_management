
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>Gigfloww Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row">
    <div class="md:w-1/2 w-full">
      <img alt="People working" class="w-full h-full object-cover"
        src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" />
    </div>
    <div class="md:w-1/2 w-full flex flex-col justify-center items-center px-8 py-12 bg-gradient-to-br from-[#d6e2ea] via-[#b3c7d5] to-[#7f9db0]">
      <div class="flex flex-col items-center mb-6">
        <img alt="Gigfloww logo" class="mb-2" height="40" src="https://storage.googleapis.com/a1aa/image/4e707c18-f4ee-4d0c-628e-7149d647540a.jpg" width="40" />
        <h1 class="text-white font-extrabold text-xl tracking-wide drop-shadow-md select-none">GIGFLOWW</h1>
      </div>
      <p class="text-black text-lg mb-8 select-none">Welcome to Gigfloww</p>
      <form id="registerForm" action="http://localhost:3000/register" method="POST">
        <h2 class="text-gray-900 text-2xl font-semibold mb-1 text-center">Register</h2>
        <p class="text-gray-600 text-center mb-6">Seamless HR operations start now!<br />Sign up</p>
        
        <label class="block text-gray-900 font-medium mb-1" for="name">Name</label>
        <input name="username" id="name" type="text" required class="w-full mb-5 px-4 py-3 rounded-full border border-gray-300" />
        
        <label class="block text-gray-900 font-medium mb-1" for="email">Email</label>
        <input name="email" id="email" type="email" required class="w-full mb-5 px-4 py-3 rounded-full border border-gray-300" />
        
        <label class="block text-gray-900 font-medium mb-1" for="password">Password</label>
        <input name="password" id="password" type="password" required class="w-full mb-7 px-4 py-3 rounded-full border border-gray-300" />
        
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-900 text-white font-semibold rounded-md py-3 mb-5">Register</button>
      </form>
    </div>
  </div>
</body>
</html>
